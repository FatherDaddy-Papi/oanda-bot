name: RSI Bot

on:
  schedule:
    # Every 15 min at :05/:20/:35/:50 -- a few min after each M15 candle closes
    # at :00/:15/:30/:45 UTC. GitHub cron is best-effort with 5-15 min lag,
    # so some runs will see a slightly-stale bar; the bot tolerates that
    # (idempotent: same bar evaluated twice produces the same decision).
    - cron: '5,20,35,50 * * * *'
  workflow_dispatch:

# Don't kick off a second run if the previous one is still going (shouldn't happen but safety net).
concurrency:
  group: rsi-bot
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false  # if one instrument errors, the others still run
      matrix:
        # Expanded matrix 2026-05-26 alongside M15 timeframe switch.
        # XAU_USD and XAG_USD still excluded (slippage >> edge for any
        # mean-reverter; see compare_slippage.py). Cross-section now spans
        # majors, crosses, commodity currencies, JPY pairs, and indices.
        instrument: [EUR_USD, GBP_USD, AUD_USD, NZD_USD, USD_CAD, USD_CHF,
                     USD_JPY, EUR_JPY, GBP_JPY,
                     NAS100_USD, SPX500_USD]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        run: pip install --quiet oandapyV20 requests six python-dotenv

      - name: Run tick for ${{ matrix.instrument }}
        env:
          OANDA_ACCOUNT_ID: ${{ secrets.OANDA_ACCOUNT_ID }}
          OANDA_API_TOKEN: ${{ secrets.OANDA_API_TOKEN }}
          OANDA_ENV: practice
        run: python tick_once.py ${{ matrix.instrument }}
